name: CI

on:
  push:
    branches: [main, web-koinaku, web-mvp]
  pull_request:
    branches: [main, web-koinaku, web-mvp]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Type check, lint, and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run type-check

      - name: Lint
        run: pnpm run lint

      - name: Unit tests
        run: pnpm run test

      - name: Production build
        run: pnpm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-build.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-build-anon-key

      - name: Enforce immutable migration history
        run: pnpm run test:migration-history
        env:
          MIGRATION_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}

      - name: Verify clean worktree
        run: pnpm run test:clean-worktree

      - name: Audit dependencies
        run: pnpm audit --prod --audit-level=high

  supabase:
    name: Supabase migration and RLS contract tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full local database reset requires private curriculum migrations that
      # are intentionally excluded from this public repository. The private
      # release lane runs that reset against the complete migration overlay.
      # Public CI still enforces migration and RLS contracts without inventing
      # incomplete curriculum fixtures or exposing private SQL.
      - name: Run migration and RLS contract tests
        run: pnpm exec vitest run tests/migrations tests/security

      - name: Verify clean worktree
        run: pnpm run test:clean-worktree
