[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  # Next.js runtime plugin handles serverless builds; no static export.

# web.koinaku.com is served by Netlify.
# Cron jobs still live in vercel.json as Next.js cron definitions; they are
# invoked by an external scheduler (or can be migrated to Netlify scheduled
# functions in a dedicated infra task).
