[build]
  command = "pnpm build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"
  # This app is a static export (output: export) — the Next.js runtime plugin
  # expects a server build and fails on it. Serve out/ as plain static files.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "/api/cron/streak-reminders"
  to = "/.netlify/functions/streak-reminders"
  status = 200

[[redirects]]
  from = "/api/cron/market-data-update"
  to = "/.netlify/functions/market-data-update"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
