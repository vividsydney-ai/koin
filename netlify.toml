[build]
  command = "pnpm build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10"

[[redirects]]
  from = "/api/cron/streak-reminders"
  to = "/.netlify/functions/streak-reminders"
  status = 200

[[redirects]]
  from = "/api/cron/market-data-update"
  to = "/.netlify/functions/market-data-update"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
